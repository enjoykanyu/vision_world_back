server:
  address: ":50052"
  name: "video-service"
  version: "1.0.0"
  environment: "development"

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "901project"
  database: "videoworld"
  max_open_conns: 25
  max_idle_conns: 5

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

kafka:
  brokers:
    - "localhost:9092"
  topic: "video-events"

discovery:
  type: "etcd"  # etcd, consul
  address: "localhost:2379"
  interval: 10

log:
  level: "info"  # debug, info, warn, error
  file: "logs/video-service.log"

#文件服务器配置
minio:
  endpoint: "localhost:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  use_ssl: false
  bucket_name: "videos"
  location: "us-east-1"

# 服务间调用配置
services:
  audit_service:
    name: "audit-service"
    address: "localhost:50053"  # audit_service的gRPC地址
    timeout: 5  # 调用超时时间（秒）

# RabbitMQ配置
rabbitmq:
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  vhost: "/"
  queue_name: "audit_queue"