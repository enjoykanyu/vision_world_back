# SRS configuration for Vision World live streaming
listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       192.168.1.4;
}

vhost __defaultVhost__ {
    hls {
        enabled             on;
        # === 低延迟 HLS 配置 ===
        # 注意：WebRTC 推流的 GOP 由浏览器控制，通常是 10 秒
        # 要实现真正的 1 秒 GOP，需要使用 OBS/FFmpeg 推流并设置 GOP=1 秒
        
        hls_fragment        2;          # 2 秒片段（WebRTC GOP 通常较大）
        hls_window          10;         # 10 秒窗口
        hls_path            ./objs/nginx/html;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
        hls_acodec          aac;
        hls_vcodec          h264;
        hls_cleanup         on;
        hls_dispose         10;
        hls_wait_keyframe   on;         # 等待关键帧，确保切片正确
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
        pli_for_rtmp    on;
    }
    
    # 播放配置
    gop_cache       on;         # 开启 GOP 缓存，确保 HLS 有数据
    queue_length    10;
    min_latency     off;        # 关闭最小延迟，确保稳定性
    tcp_nodelay     on;
}
