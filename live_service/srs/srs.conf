# SRS configuration for Vision World live streaming
# @see full.conf for detail config.

listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8085;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    # 使用宿主机 IP 作为 candidate
    # 浏览器通过这个 IP 与 SRS 建立 WebRTC 连接
    candidate       192.168.1.4;
}

vhost __defaultVhost__ {
    hls {
        enabled         on;
        hls_fragment    10;
        hls_window      60;
        hls_path        ./objs/nginx/html;
        hls_m3u8_file   [app]/[stream].m3u8;
        hls_ts_file     [app]/[stream]-[seq].ts;
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }

    # 启用 CORS 支持，允许浏览器跨域访问 HLS 流
    http_cors {
        enabled         on;
        allow           *;
        allow-origin    *;
        allow-methods   GET, POST, OPTIONS;
        allow-headers   *;
    }

    # SRS callbacks to notify backend about stream events
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8080/api/live/srs/callback;
        on_unpublish    http://host.docker.internal:8080/api/live/srs/callback;
        on_play         http://host.docker.internal:8080/api/live/srs/callback;
        on_stop         http://host.docker.internal:8080/api/live/srs/callback;
    }
}
