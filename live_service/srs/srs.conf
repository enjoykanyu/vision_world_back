# SRS configuration for Vision World live streaming
listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    hls {
        enabled             on;
        # === 低延迟 HLS 配置 ===
        # 注意：WebRTC 推流的 GOP 由浏览器控制，通常是 10 秒
        # 要实现真正的 1 秒 GOP，需要使用 OBS/FFmpeg 推流并设置 GOP=1 秒
        
        hls_fragment        1;          # 目标 1 秒片段
        hls_window          4;          # 4 秒窗口
        hls_path            ./objs/nginx/html;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
        hls_acodec          aac;
        hls_vcodec          h264;
        hls_cleanup         on;
        hls_dispose         5;
        hls_wait_keyframe   off;        # 不等待关键帧（可能产生非关键帧开头的片段）
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
        pli_for_rtmp    on;
    }
    
    # 降低延迟配置
    gop_cache       off;
    queue_length    3;
    min_latency     on;
    mr_latency      100;
    tcp_nodelay     on;
}
