# SRS configuration for Vision World live streaming
listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       127.0.0.1;
}

vhost __defaultVhost__ {
    hls {
        enabled             on;
        hls_fragment        1;          # 1秒一个片段
        hls_window          5;          # 5秒窗口
        hls_path            ./objs/nginx/html;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].m4s;  # 使用 M4S 格式 (fMP4)
        hls_acodec          aac;
        hls_vcodec          h264;
        hls_dts_directly    on;         # 直接使用 DTS，减少延迟
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
    }
    
    # 降低 GOP 大小，减少延迟
    gop_cache       off;
    queue_length    10;
}
