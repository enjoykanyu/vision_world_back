# SRS configuration for Vision World live streaming
listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       192.168.1.4;
}

vhost __defaultVhost__ {
    hls {
        enabled             on;
        # === 低延迟 HLS 配置 ===
        # 目标：3-4秒延迟，同时保持稳定性
        
        hls_fragment        1;          # 1秒分片
        hls_window          3;          # 3秒窗口（3个分片）
        hls_path            ./objs/nginx/html;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
        hls_acodec          aac;
        hls_vcodec          h264;
        hls_cleanup         on;
        hls_dispose         10;         # 10秒后清理
        hls_wait_keyframe   on;         # 等待关键帧，确保切片正确生成
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
        pli_for_rtmp    on;
    }
    
    # 播放配置 - 平衡延迟和稳定性
    gop_cache       on;         # 开启GOP缓存，确保HLS有数据
    queue_length    5;
    min_latency     off;        # 关闭最小延迟，换取稳定性
    tcp_nodelay     on;
}
