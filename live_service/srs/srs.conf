# SRS configuration for Vision World live streaming
listen              1935;
max_connections     1000;
srs_log_tank        console;
daemon              off;

http_api {
    enabled         on;
    listen          1985;
}

http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

rtc_server {
    enabled         on;
    listen          8000;
    candidate       192.168.1.4;
}

vhost __defaultVhost__ {
    hls {
        enabled             on;
        # === 低延迟 HLS 配置 ===
        # 目标：3-4秒延迟，同时保持稳定性
        
        hls_fragment        1;          # 1秒分片
        hls_window          3;          # 3秒窗口（3个分片）
        hls_path            ./objs/nginx/html;
        hls_m3u8_file       [app]/[stream].m3u8;
        hls_ts_file         [app]/[stream]-[seq].ts;
        hls_acodec          aac;
        hls_vcodec          h264;
        hls_cleanup         on;
        hls_dispose         10;         # 10秒后清理
        hls_wait_keyframe   off;        # 不等待关键帧，强制按时间切片
    }

    http_remux {
        enabled     on;
        mount       [vhost]/[app]/[stream].flv;
    }

    rtc {
        enabled         on;
        rtmp_to_rtc     on;
        rtc_to_rtmp     on;
        pli_for_rtmp    on;
    }
    
    # 播放配置 - 低延迟优化
    gop_cache       off;        # 关闭GOP缓存
    queue_length    5;
    min_latency     on;         # 开启最小延迟
    tcp_nodelay     on;
    
    # HTTP回调配置 - 用于主播下播通知
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:8088/api/srs/callback;
        on_unpublish    http://host.docker.internal:8088/api/srs/callback;
        on_play         http://host.docker.internal:8088/api/srs/callback;
        on_stop         http://host.docker.internal:8088/api/srs/callback;
    }
}
