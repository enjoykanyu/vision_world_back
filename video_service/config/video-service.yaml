# 视频服务配置文件

server:
  port: 8081
  host: "0.0.0.0"

# 数据库配置
database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "901project"
  dbname: "videoworld"
  charset: "utf8mb4"
  parseTime: true
  loc: "Local"

# Redis配置
redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10
  min_idle_conns: 5

# MinIO配置
minio:
  endpoint: "localhost:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin"
  bucket_name: "videos"
  secure: false

# API网关配置
api_gateway:
  endpoint: "http://localhost:3000"

# RabbitMQ配置
rabbitmq:
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  exchange_name: "video_exchange"
  queue_name: "video_queue"
  routing_key: "video_routing_key"

# 日志配置
log:
  level: "info"
  file_path: "logs/video_service.log"
  max_size: 100
  max_backups: 10
  max_age: 7
  compress: false

# 服务注册配置
service:
  name: "video-service"
  version: "1.0.0"
  etcd_endpoints: ["localhost:2379"]
  ttl: 30
  interval: 10

# 审核服务配置
audit:
  exchange_name: "audit_exchange"
  queue_name: "audit_queue"
  routing_key: "audit_routing_key"

# 转码服务配置
transcode:
  ffmpeg_path: "/usr/local/bin/ffmpeg"
  work_dir: "/tmp/transcode"
  output_dir: "/tmp/transcode_output"
  preset: "medium"
  segment_duration: 10
  timeout: 7200
  log_level: "info"
