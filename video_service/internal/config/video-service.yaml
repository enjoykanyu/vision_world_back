server:
  address: ":50052"
  name: "video-service"
  version: "1.0.0"
  environment: "development"

database:
  host: "localhost"
  port: 3306
  username: "root"
  password: "901project"
  database: "videoworld"
  max_open_conns: 25
  max_idle_conns: 5

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  pool_size: 10

kafka:
  brokers:
    - "localhost:9092"
  topic: "video-events"

rabbitmq:
  host: "localhost"
  port: 5672
  username: "guest"
  password: "guest"
  vhost: "/"
  queue_name: "audit_queue"

discovery:
  type: "etcd"
  address: "localhost:2379"
  interval: 10
  timeout: 5
  deregister_critical_service_after: "30s"
  consul:
    datacenter: "dc1"
    token: ""
  etcd:
    dial_timeout: 5
    username: ""
    password: ""

logger:
  level: "info"
  format: "json"
  output_path: "logs/video-service.log"

services:
  audit_service:
    name: "audit-service"
    address: "localhost:50053"
    timeout: 5

minio:
  endpoint: "localhost:9000"
  access_key_id: "minioadmin"
  secret_access_key: "minioadmin"
  use_ssl: false
  bucket_name: "videos"
  location: "us-east-1"