syntax = "proto3";

package livepb;

option go_package = "github.com/vision_world/api_gateway/proto_gen/live";

// 直播服务 
service LiveService {
    // 直播间管理
    rpc CreateRoom(CreateRoomRequest) returns (CreateRoomResponse);
    rpc StartLive(StartLiveRequest) returns (StartLiveResponse);
    rpc StopLive(StopLiveRequest) returns (StopLiveResponse);
    rpc GetRoomInfo(GetRoomInfoRequest) returns (GetRoomInfoResponse);
    
    // 观看相关
    rpc EnterRoom(EnterRoomRequest) returns (EnterRoomResponse);
    rpc LeaveRoom(LeaveRoomRequest) returns (LeaveRoomResponse);
    rpc GetLiveList(GetLiveListRequest) returns (GetLiveListResponse);
}

// ========== 基础消息 ==========
message BaseResponse {
    int32 code = 1;
    string message = 2;
}

// ========== 创建直播间 ==========
message CreateRoomRequest {
    uint64 user_id = 1;
    string title = 2;
    string category = 3;
    string cover_url = 4;
}

message CreateRoomResponse {
    int32 code = 1;
    string message = 2;
    uint64 room_id = 3;
    string stream_key = 4;
    string push_url = 5;
}

// ========== 开始直播 ==========
message StartLiveRequest {
    uint64 user_id = 1;
    uint64 room_id = 2;
}

message StartLiveResponse {
    int32 code = 1;
    string message = 2;
    string play_url = 3;
    string stream_key = 4;
}

// ========== 结束直播 ==========
message StopLiveRequest {
    uint64 user_id = 1;
    uint64 room_id = 2;
}

message StopLiveResponse {
    int32 code = 1;
    string message = 2;
}

// ========== 获取房间信息 ==========
message GetRoomInfoRequest {
    uint64 room_id = 1;
}

message GetRoomInfoResponse {
    int32 code = 1;
    string message = 2;
    LiveRoom room = 3;
}

// ========== 进入直播间 ==========
message EnterRoomRequest {
    uint64 user_id = 1;
    uint64 room_id = 2;
}

message EnterRoomResponse {
    int32 code = 1;
    string message = 2;
    string play_url = 3;
    int32 online_count = 4;
}

// ========== 离开直播间 ==========
message LeaveRoomRequest {
    uint64 user_id = 1;
    uint64 room_id = 2;
}

message LeaveRoomResponse {
    int32 code = 1;
    string message = 2;
}

// ========== 获取直播列表 ==========
message GetLiveListRequest {
    string category = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message GetLiveListResponse {
    int32 code = 1;
    string message = 2;
    repeated LiveRoom rooms = 3;
    int32 total = 4;
}

// ========== 数据模型 ==========
message LiveRoom {
    uint64 id = 1;
    uint64 user_id = 2;
    string title = 3;
    string category = 4;
    string status = 5;  // offline, streaming, banned
    string cover_url = 6;
    string stream_key = 7;
    string play_url = 8;
    int32 online_count = 9;
    int64 started_at = 10;
    int64 ended_at = 11;
    int64 created_at = 12;
    int64 updated_at = 13;
}
